[project]
name = "agentic-harness-build"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "playwright>=1.64.1",
    "pydantic>=2.14.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
agentic-harness-build = "agentic_harness_build:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
